# Railway — NestJS API (deploy from repo root)
# Dashboard: Root Directory = repo root (empty). Use Dockerfile builder.
#
# IMPORTANT: In Railway UI → Settings → Deploy, CLEAR any leftover
# "Custom Pre-deploy Command" from the old issue tracker
# (e.g. `npx prisma migrate deploy`). Migrations already run in the
# container CMD. A stale predeploy will fail on the new monorepo layout.

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"

[deploy]
# Do NOT set preDeployCommand here — migrate runs in Dockerfile CMD.
healthcheckPath = "/api/docs"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
